services:
  app:
    build:
      context: .
      args:
        INSTALL_MINERU: ${INSTALL_MINERU:-false}
        MINERU_PACKAGE: ${MINERU_PACKAGE:-mineru[core]}
    container_name: trading_bot_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tools:/app/tools
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://mongo:27017/
      - PDF_PARSER_MODE=${PDF_PARSER_MODE:-pymupdf}
      - MINERU_COMMAND=${MINERU_COMMAND:-/opt/mineru_venv/bin/mineru}
      - MINERU_BACKEND=${MINERU_BACKEND:-pipeline}
      - MINERU_METHOD=${MINERU_METHOD:-auto}
      - MINERU_TIMEOUT_SECONDS=${MINERU_TIMEOUT_SECONDS:-1800}
      - MINERU_PARSE_BOOKS=${MINERU_PARSE_BOOKS:-false}
      - MINERU_SELECTIVE_BOOK_PAGES_ENABLED=${MINERU_SELECTIVE_BOOK_PAGES_ENABLED:-true}
      - MINERU_SELECTIVE_MAX_PAGES_PER_DOC=${MINERU_SELECTIVE_MAX_PAGES_PER_DOC:-5}
      - MINERU_SELECTIVE_MAX_RANGES_PER_DOC=${MINERU_SELECTIVE_MAX_RANGES_PER_DOC:-5}
      - MINERU_SELECTIVE_LOW_TEXT_CHARS=${MINERU_SELECTIVE_LOW_TEXT_CHARS:-300}
      - MINERU_SELECTIVE_TABLE_LIKE_THRESHOLD=${MINERU_SELECTIVE_TABLE_LIKE_THRESHOLD:-0.25}
      - MINERU_SELECTIVE_IMAGE_AREA_RATIO=${MINERU_SELECTIVE_IMAGE_AREA_RATIO:-0.20}
      - MINERU_FULL_MAX_PAGES_SOFT_LIMIT=${MINERU_FULL_MAX_PAGES_SOFT_LIMIT:-25}
      - MINERU_FULL_COMPLEX_PAGE_RATIO_THRESHOLD=${MINERU_FULL_COMPLEX_PAGE_RATIO_THRESHOLD:-0.35}
      - PARSER_OUTPUT_SCHEMA_VERSION=${PARSER_OUTPUT_SCHEMA_VERSION:-adaptive_pdf_parse_v1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-cohere}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - EMBEDDING_REQUEST_TIMEOUT_SECONDS=${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-90}
      - EMBEDDING_MAX_RETRIES=${EMBEDDING_MAX_RETRIES:-5}
      - EMBEDDING_BACKOFF_BASE_SECONDS=${EMBEDDING_BACKOFF_BASE_SECONDS:-10}
      - EMBEDDING_BACKOFF_MAX_SECONDS=${EMBEDDING_BACKOFF_MAX_SECONDS:-300}
      - EMBEDDING_RATE_LIMIT_COOLDOWN_SECONDS=${EMBEDDING_RATE_LIMIT_COOLDOWN_SECONDS:-600}
      - EMBEDDING_CIRCUIT_BREAKER_FAILURES=${EMBEDDING_CIRCUIT_BREAKER_FAILURES:-3}
      - EMBEDDING_FAIL_FAST_ON_AUTH=${EMBEDDING_FAIL_FAST_ON_AUTH:-true}
      - EMBEDDING_RETRY_JITTER=${EMBEDDING_RETRY_JITTER:-true}
      - EMBEDDING_CACHE_ENABLED=${EMBEDDING_CACHE_ENABLED:-true}
      - EMBEDDING_CACHE_BACKEND=${EMBEDDING_CACHE_BACKEND:-sqlite}
      - EMBEDDING_CACHE_PATH=${EMBEDDING_CACHE_PATH:-/app/data/cache/embedding_cache.sqlite}
      - KNOWLEDGE_UPDATE_RETRY_FAILED_ONLY=${KNOWLEDGE_UPDATE_RETRY_FAILED_ONLY:-false}
      - KNOWLEDGE_UPDATE_MAX_DOCS_PER_RUN=${KNOWLEDGE_UPDATE_MAX_DOCS_PER_RUN:-0}
      - KNOWLEDGE_UPDATE_MAX_VECTORS_PER_RUN=${KNOWLEDGE_UPDATE_MAX_VECTORS_PER_RUN:-0}
      - KNOWLEDGE_UPDATE_STOP_ON_RATE_LIMIT=${KNOWLEDGE_UPDATE_STOP_ON_RATE_LIMIT:-true}
      - KNOWLEDGE_UPDATE_FAST_PRECHECK_ENABLED=${KNOWLEDGE_UPDATE_FAST_PRECHECK_ENABLED:-true}
      - KNOWLEDGE_UPDATE_FAST_PRECHECK_HASH_CACHE_ENABLED=${KNOWLEDGE_UPDATE_FAST_PRECHECK_HASH_CACHE_ENABLED:-true}
      - KNOWLEDGE_UPDATE_FORCE_REPARSE=${KNOWLEDGE_UPDATE_FORCE_REPARSE:-false}
      - KNOWLEDGE_UPDATE_FORCE_REINDEX=${KNOWLEDGE_UPDATE_FORCE_REINDEX:-false}
      - KNOWLEDGE_UPDATE_LOG_PRECHECK=${KNOWLEDGE_UPDATE_LOG_PRECHECK:-true}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-mt5_bridge}
      - MT5_BRIDGE_URL=${MT5_BRIDGE_URL:-http://host.docker.internal:8765}
      - MT5_BRIDGE_TIMEOUT_SECONDS=${MT5_BRIDGE_TIMEOUT_SECONDS:-3}
      - MT5_DEFAULT_CANDLE_COUNT=${MT5_DEFAULT_CANDLE_COUNT:-300}
      - MT5_DEFAULT_TIMEFRAMES=${MT5_DEFAULT_TIMEFRAMES:-M15,H1,H4}
      - MT5_SYMBOL_MAP_XAUUSD=${MT5_SYMBOL_MAP_XAUUSD:-XAUUSD}
      - MARKET_DEFAULT_SYMBOL=${MARKET_DEFAULT_SYMBOL:-XAUUSD}
      - MARKET_BROKER_SYMBOL_XAUUSD=${MARKET_BROKER_SYMBOL_XAUUSD:-}
      - MARKET_DEFAULT_TIMEFRAMES=${MARKET_DEFAULT_TIMEFRAMES:-M15,H1,H4}
      - MARKET_DEFAULT_CANDLE_COUNT=${MARKET_DEFAULT_CANDLE_COUNT:-300}
      - MARKET_STALE_BAR_SECONDS_M5=${MARKET_STALE_BAR_SECONDS_M5:-900}
      - MARKET_STALE_BAR_SECONDS_M15=${MARKET_STALE_BAR_SECONDS_M15:-1800}
      - MARKET_STALE_BAR_SECONDS_H1=${MARKET_STALE_BAR_SECONDS_H1:-7200}
      - MARKET_STALE_BAR_SECONDS_H4=${MARKET_STALE_BAR_SECONDS_H4:-21600}
      - MARKET_STALE_BAR_SECONDS_D1=${MARKET_STALE_BAR_SECONDS_D1:-172800}
      - MARKET_MAX_SPREAD_XAUUSD=${MARKET_MAX_SPREAD_XAUUSD:-1.0}
      - OANDA_LEGACY_ENABLED=${OANDA_LEGACY_ENABLED:-false}
      - OANDA_ENVIRONMENT=${OANDA_ENVIRONMENT:-practice}
      - SEMANTIC_CONTEXT_EXECUTOR_ENABLED=${SEMANTIC_CONTEXT_EXECUTOR_ENABLED:-true}
      - SEMANTIC_CONTEXT_EXECUTOR_AUTHORITATIVE=${SEMANTIC_CONTEXT_EXECUTOR_AUTHORITATIVE:-true}
      - SEMANTIC_CONTEXT_REUSE_LEGACY_PREFETCH=${SEMANTIC_CONTEXT_REUSE_LEGACY_PREFETCH:-true}
      - SEMANTIC_CONTEXT_BLOCK_DUPLICATE_FETCH=${SEMANTIC_CONTEXT_BLOCK_DUPLICATE_FETCH:-true}
      - SEMANTIC_CONTEXT_TASK_VIEWS_ENABLED=${SEMANTIC_CONTEXT_TASK_VIEWS_ENABLED:-true}
      - SEMANTIC_CONTEXT_KNOWLEDGE_USE_V3=${SEMANTIC_CONTEXT_KNOWLEDGE_USE_V3:-true}
      - SEMANTIC_CONTEXT_KNOWLEDGE_FALLBACK_TO_LEGACY=${SEMANTIC_CONTEXT_KNOWLEDGE_FALLBACK_TO_LEGACY:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - mongo
    networks:
      - bot_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading_bot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bot_network
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: trading_bot_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bot_network
    restart: unless-stopped

networks:
  bot_network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
